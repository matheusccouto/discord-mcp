[project]
name = "discord-mcp"
version = "0.1.0"
description = "Discord REST API as an MCP server"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.2", "httpx2>=2.16"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
# Each ignore has a reason; nothing else is switched off.
ignore = [
  "CPY001", # the MIT LICENSE file carries the notice; per-file headers only rot
  "D203",   # conflicts with D211, which ruff already applies
  "D213",   # conflicts with D212, which ruff already applies
  "COM812", # conflicts with the formatter, per ruff's own guidance
]

[tool.ruff.lint.per-file-ignores]
# pytest reports through asserts; that is the only place S101 is allowed.
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ty]
