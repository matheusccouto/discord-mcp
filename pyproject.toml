[project]
name = "discord-mcp"
version = "0.1.0"
description = "Discord REST API as an MCP server"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.2", "httpx2>=2.16"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
# Each ignore has a reason; nothing else is switched off.
ignore = [
  "CPY001", # the MIT LICENSE file carries the notice; per-file headers only rot
  "D203",   # conflicts with D211, which ruff already applies
  "D213",   # conflicts with D212, which ruff already applies
  "COM812", # conflicts with the formatter, per ruff's own guidance
]

[tool.ty]
